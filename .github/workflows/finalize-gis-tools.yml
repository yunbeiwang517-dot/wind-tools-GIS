name: Finalize GIS tools

on:
  push:
    paths:
      - '.github/workflows/finalize-gis-tools.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and publish tools
        shell: bash
        run: |
          set -euo pipefail

          cat .stage_upload/poly/part_* | base64 -d | xz -dc > "多边形坐标生成工具.html"
          cat .stage_upload/point/part_* | base64 -d | xz -dc > "点位坐标转换工具.html"

          echo "293ee8958124279bf9daa5082261384e706d9d5751aa144cb1b0715b4120085a  多边形坐标生成工具.html" | sha256sum -c -
          echo "12cd65392f927a41cafcfacc443d36ccb8811b8e768b6eb7b33c1e53d8693965  点位坐标转换工具.html" | sha256sum -c -

          rm -rf .stage_upload
          rm -f .github/workflows/finalize-gis-tools.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add GIS HTML tools"
          git push
